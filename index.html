      nextLabel: sess.i === sess.list.length - 1 ? 'Fertig 🏁' : 'Weiter ➜', test: !!sess.test,
    });
  },

  summary(sess) {
    const ok = sess.res.filter(r => r.ok).length, n = sess.res.length, first = sess.res.filter(r => r.ok && !r.tries).length, xp = sess.res.reduce((a, r) => a + r.xp, 0);
    if (n && first === n && n >= 5) { S.perfect++; save(); checkBadges(); }
    if (sess.mode === 'topic' && S.examDay && S.examDay.date === today() && S.examDay.topic === sess.topicId) { S.examDay.done = true; save(); }
    const ratio = n ? ok / n : 0, emoji = ratio >= .9 ? '🏆' : ratio >= .7 ? '🌟' : ratio >= .5 ? '💪' : '🌱';
    const msg = ratio >= .9 ? 'Unglaublich! Du bist eine echte Mathe-Heldin!' : ratio >= .7 ? 'Richtig stark! Man merkt, dass du übst.' : ratio >= .5 ? 'Gut gemacht! Jeder Fehler hat dir heute etwas beigebracht.' : 'Das war heute schwierig – und du hast trotzdem durchgehalten. Genau so wird man besser! 🌱';
    const byTopic = {}; sess.res.forEach(r => { (byTopic[r.topic] ||= { n: 0, ok: 0 }); byTopic[r.topic].n++; if (r.ok) byTopic[r.topic].ok++; });
    const weak = Object.entries(byTopic).filter(([, v]) => v.ok / v.n < .6).map(([k]) => TOPIC[k]);
    const testInfo = sess.test ? `<div class="card" style="text-align:left;margin:14px 0"><h3>📝 Ergebnis Probe-Test: ${ok} von ${n} Punkten (${Math.round(ratio * 100)} %)</h3>${Object.entries(byTopic).map(([k, v]) => `<div>${TOPIC[k].icon} ${TOPIC[k].title}: <b>${v.ok}/${v.n}</b> ${v.ok === v.n ? '✅' : v.ok / v.n >= .5 ? '🟡' : '🔴'}</div>`).join('')}<p class="small muted">🔴 = hier lohnt sich die Erklärung nochmal · Alle falschen Aufgaben sind jetzt in der Fehler-Kiste.</p></div>` : '';
    app().innerHTML = `<div class="card center" style="max-width:640px;margin:10px auto"><div class="big-emoji">${emoji}</div><h1>${sess.test ? 'Probe-Test fertig!' : 'Geschafft!'}</h1><p style="font-size:20px">${msg}</p>${testInfo}
      <div class="grid g3" style="margin:18px 0"><div><div class="stat">${ok}/${n}</div><div class="muted small">richtig</div></div><div><div class="stat">${first}</div><div class="muted small">beim 1. Versuch</div></div><div><div class="stat">+${xp}</div><div class="muted small">XP</div></div></div>
      ${weak.length ? `<div class="merke" style="text-align:left">Euli empfiehlt: Schau dir nochmal die Erklärung zu <b>${weak.map(t => t.title).join('</b> und <b>')}</b> an. 📖</div><div class="row" style="justify-content:center;margin-bottom:12px">${weak.slice(0, 2).map(t => `<button class="btn" onclick="go('lesson','${t.id}')">${t.icon} ${t.title}</button>`).join('')}</div>` : ''}
      ${!STORAGE_OK && !SAVE_HANDLE ? `<div class="merke" style="text-align:left;border-color:#e5484d">Damit dein Fortschritt nicht verloren geht: <div class="row" style="margin-top:6px">${saveFileButtons()}</div></div>` : ''}
      <div class="row" style="justify-content:center"><button class="btn primary big" onclick="go('home')">🏠 Zur Startseite</button></div></div>`;
    if (ratio >= .7) { confetti(180); sndWin(); }
  },

  badges() {
    const L = lvl();
    app().innerHTML = `<h1>🏆 Meine Erfolge</h1><div class="card"><div class="row"><div style="font-size:60px">${S.profile.avatar}</div><div style="flex:1"><h2 style="margin:0">${esc(S.profile.name)}</h2><div><b>Level ${L.l}</b> – ${L.title}</div><div class="progress" style="margin:8px 0 2px"><i style="width:${L.pct}%"></i></div><div class="small muted">${S.xp} XP · noch ${L.need} XP bis Level ${L.l + 1}</div></div></div>
      <div class="grid g3" style="margin-top:14px;text-align:center"><div><div class="stat">${S.total}</div><div class="small muted">Aufgaben</div></div><div><div class="stat">🔥 ${streak()}</div><div class="small muted">Tage am Stück</div></div><div><div class="stat">${TOPICS.reduce((a, t) => a + starsOf(t.id), 0)}</div><div class="small muted">Sterne</div></div></div></div>
      <h2>Abzeichen</h2><div class="grid g3">${BADGES.map(b => `<div class="card badge ${S.badges.includes(b.id) ? '' : 'locked'}"><div class="ic">${b.icon}</div><b>${b.name}</b><div class="small muted">${b.desc}</div></div>`).join('')}</div>
      <p class="center" style="margin-top:20px"><button class="btn ghost" onclick="editProfile()">✏️ Name / Tier ändern</button></p>`;
  },

  parentsGate() {
    const a = rnd(12, 19), b = rnd(12, 19);
    app().innerHTML = `<div class="card center" style="max-width:480px;margin:30px auto"><h1>👨‍👩‍👧 Elternbereich</h1><p>Bitte lösen, um fortzufahren:</p><p style="font-size:28px;font-weight:900">${a} · ${b} = ?</p><input class="ans" id="pg" inputmode="numeric"><div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" onclick="go('home')">Zurück</button><button class="btn primary" id="pgo">Öffnen</button></div></div>`;
    const ok = () => +$('#pg').value === a * b ? VIEWS.parents() : (toast('Leider falsch.'), go('parentsGate'));
    $('#pgo').onclick = ok; $('#pg').onkeydown = e => { if (e.key === 'Enter') ok(); }; $('#pg').focus();
  },

  parents() {
    header();
    const days = []; for (let k = 27; k >= 0; k--) { const d = new Date(); d.setDate(d.getDate() - k); days.push([dkey(d), S.days[dkey(d)], d]); }
    const act = Object.values(S.days).filter(d => d.n > 0), tot = act.reduce((a, d) => a + d.n, 0), ok1 = act.reduce((a, d) => a + (d.ok1 || 0), 0), sec = act.reduce((a, d) => a + d.sec, 0);
    const last7 = days.slice(-7).filter(([, d]) => d && d.n > 0).length;
    const mByTopic = {}; S.mistakes.forEach(m => mByTopic[m.topic] = (mByTopic[m.topic] || 0) + 1);
    app().innerHTML = `<div class="row" style="justify-content:space-between"><h1>👨‍👩‍👧 Elternbereich</h1><button class="btn ghost" onclick="go('home')">Zurück zur App</button></div>
      <div class="grid g3"><div class="card center"><div class="stat">${last7}/7</div><div class="small muted">Übungstage letzte Woche</div></div><div class="card center"><div class="stat">${tot}</div><div class="small muted">Aufgaben gesamt</div></div>
        <div class="card center"><div class="stat">${tot ? Math.round(ok1 / tot * 100) : 0}%</div><div class="small muted">beim 1. Versuch richtig</div></div><div class="card center"><div class="stat">${act.length ? Math.round(sec / 60 / act.length) : 0} min</div><div class="small muted">Ø Lernzeit pro Übungstag</div></div>
        <div class="card center"><div class="stat">${S.lessons}</div><div class="small muted">Erklärungen durchgearbeitet</div></div><div class="card center"><div class="stat">${S.mistakes.length}</div><div class="small muted">offene Fehler in der Kiste</div></div></div>
      <h2>📅 Letzte 4 Wochen</h2><div class="card"><div class="cal">${days.map(([k, d, dt]) => `<i title="${dt.toLocaleDateString('de-AT')}: ${d ? d.n : 0} Aufgaben" style="background:${!d || !d.n ? '#ece4f5' : d.goal ? '#16a34a' : '#86efac'}">${dt.getDate()}</i>`).join('')}</div><p class="small muted">Dunkelgrün = Tagesziel erreicht · Hellgrün = geübt</p></div>
      <h2>📈 Stand pro Thema</h2><div class="card" style="overflow-x:auto"><table class="ptbl"><tr><th>Thema</th><th>Können</th><th>Stufe</th><th>Aufgaben</th><th>richtig</th><th>offene Fehler</th><th>zuletzt</th></tr>
        ${TOPICS.map(t => { const s = tp(t.id); return `<tr><td>${t.icon} ${t.title}${s.lesson ? ' 📖' : ''}</td><td style="min-width:110px"><div class="mbar"><i style="width:${s.m}%"></i></div><span class="small">${s.m}%</span></td><td>${levelOf(t.id)}</td><td>${s.seen}</td><td>${s.seen ? Math.round(s.ok / s.seen * 100) + '%' : '–'}</td><td>${mByTopic[t.id] || ''}</td><td class="small">${s.last ? new Date(s.last).toLocaleDateString('de-AT') : '–'}</td></tr>`; }).join('')}</table>
        <p class="small muted">📖 = Erklärung angesehen. „Können“ steigt bei richtigen Antworten und sinkt bei Fehlern – so passt sich die Schwierigkeit automatisch an.</p></div>
      ${Object.keys(S.notes).length ? `<h2>💭 Eigene Erklärungen Ihres Kindes</h2><div class="card">${Object.entries(S.notes).map(([k, v]) => `<p><b>${TOPIC[k]?.title}:</b> <i>„${esc(v)}“</i></p>`).join('')}<p class="small muted">Tipp: Lassen Sie sich das Thema von Ihrem Kind erklären und fragen Sie neugierig nach („Und warum ist das so?“).</p></div>` : ''}
      <h2>🔎 Beobachtungen aus Heft & Stundenwiederholung (Okt. 2026)</h2><div class="card small"><p style="margin-top:0"><b>Stärken:</b> ggT/kgV inklusive Textaufgaben, Teilbarkeitsregeln, Primzahlen & Primfaktorzerlegung, Ordnen ganzer Zahlen, schriftliches Rechnen, sorgfältige Heftführung.</p>
        <p><b>Wiederkehrende Fehler – darauf übt die App jetzt gezielt:</b></p><ul style="margin:0;padding-left:22px">
        <li><b>Teilermengen unvollständig</b> (z. B. T₄₂ ohne 3 und 14) → Methode „Teilerpaare“, eigene Eingabe der ganzen Teilermenge mit Rückmeldung, wie viele Teiler fehlen.</li>
        <li><b>Vielfachenmengen ohne die Zahl selbst</b> (V₂ = {4, 6, …}) → eigene Übung, die genau diesen Fehler erkennt und erklärt.</li>
        <li><b>Raummaße</b> (1 m³ = 100 dm³ statt 1000) und <b>Einheit der Oberfläche</b> (dm³ statt dm²) → Wiederholungsaufgaben mit passender Fehlermeldung.</li></ul>
        <p style="margin-bottom:0">Diese Themen kommen im Tagestraining öfter dran. Aktuell im Unterricht: Winkel, Neben- und Scheitelwinkel (H1), davor ganze Zahlen (B) und Teilbarkeit (A).</p></div>
      <h2>🩺 Speicher-Test</h2><div class="card small"><p style="margin-top:0">${SAVE_HANDLE ? '✅ <b>Spielstand-Datei verbunden</b> – Fortschritt wird automatisch darin gespeichert.<br>' : ''}${STORAGE_OK ? '✅ <b>Speichern funktioniert</b> in diesem Browser.' : '❌ <b>Speichern funktioniert hier NICHT.</b> Bitte die Datei auf den Desktop kopieren und per Doppelklick in Edge oder Chrome öffnen.'}</p>
        <div>Gespeichert: Name <b>${S.profile ? esc(S.profile.name) : '–'}</b> · ${S.total} Aufgaben · ${Object.keys(S.days).length} Übungstage</div>
        <div>Browser: <b>${/Edg\//.test(navigator.userAgent) ? 'Microsoft Edge' : /OPR\//.test(navigator.userAgent) ? 'Opera' : /Firefox\//.test(navigator.userAgent) ? 'Firefox' : /Chrome\//.test(navigator.userAgent) ? 'Google Chrome' : /Safari\//.test(navigator.userAgent) ? 'Safari' : 'unbekannt'}</b></div>
        <div style="word-break:break-all">Geöffnet von: <code>${esc(decodeURIComponent(location.href.split('#')[0]))}</code></div>
        <div style="margin-top:10px"><b>Zusätzlich in einer Spielstand-Datei speichern</b> (empfohlen, falls der Fortschritt nach dem Schließen weg ist – z. B. weil der Browser beim Beenden Daten löscht):<div class="row" style="margin:6px 0">${saveFileButtons()}</div></div>
        <p class="muted" style="margin-bottom:0">Wichtig: Immer <b>dieselbe Datei am selben Ort</b> im <b>selben Browser</b> öffnen. Wird die Datei z. B. jedes Mal neu aus einer E-Mail geöffnet, liegt sie jedes Mal woanders.</p></div>
      <h2>📅 Schularbeit</h2><div class="card"><div class="row"><label>Name: <input id="exn" class="ans" style="width:200px;font-size:17px;text-align:left" value="${esc((S.settings.exam || {}).name || '1. Schularbeit')}"></label><label>Datum: <input id="exd" type="date" class="ans" style="width:190px;font-size:17px" value="${(S.settings.exam || {}).date || ''}"></label></div>
        <p class="small muted">Stoff (vorläufig: alles, was bisher im Heft steht). Sobald die Lehrerin den Stoff bekanntgibt, hier anpassen – der Lernplan auf der Startseite richtet sich danach. Ab 21 Tagen vor dem Termin übt das Tagestraining nur noch diesen Stoff, in den letzten 6 Tagen gibt es täglich eine Probe-Schularbeit.</p>
        <div class="focus-list">${GROUPS.map(g => `<div style="break-inside:avoid;margin-bottom:8px"><b>${g.icon} ${g.name}</b>${TOPICS.filter(t => t.group === g.id).map(t => `<label><input type="checkbox" data-ex="${t.id}" ${(S.settings.exam || { topics: [] }).topics.includes(t.id) ? 'checked' : ''}> ${t.title} <span class="muted small">${starsHTML(starsOf(t.id))}</span></label>`).join('')}</div>`).join('')}</div>
        <div class="row"><button class="btn ghost" id="exoff">Keine Schularbeit planen</button></div></div>
      <h2>🏫 Wo seid ihr gerade im Buch „${BOOK.title}“?</h2><div class="card"><p class="small muted" style="margin-top:0">Hakerl bei den Kapiteln setzen, die gerade in der Schule dran sind (Seitenzahlen stehen dabei). Markierte Themen kommen im Tagestraining 3-mal so oft dran und werden auf der Startseite als „Neu in der Schule“ vorgeschlagen. Am besten jede Woche kurz mit dem Schulheft abgleichen.</p>
        <div class="focus-list">${GROUPS.map(g => `<div style="break-inside:avoid;margin-bottom:8px"><b>${g.icon} ${g.name}</b>${TOPICS.filter(t => t.group === g.id).map(t => `<label><input type="checkbox" data-f="${t.id}" ${S.settings.focus.includes(t.id) ? 'checked' : ''}> ${t.title} <span class="muted small">(${t.book.split(' · ')[1] || t.book})</span></label>`).join('')}</div>`).join('')}</div></div>
      <h2>⚙️ Einstellungen</h2><div class="card"><div class="row"><label>Tagesziel: <select id="goal" class="ans" style="width:auto;font-size:18px">${[5, 8, 10, 12, 15, 20].map(n => `<option ${n === S.settings.goal ? 'selected' : ''} value="${n}">${n} Aufgaben (~${Math.round(n * 1.5)} min)</option>`).join('')}</select></label></div>
        <p><label><input type="checkbox" id="snd" ${S.settings.sound ? 'checked' : ''}> Töne</label> &nbsp; <label><input type="checkbox" id="voi" ${S.settings.voice ? 'checked' : ''}> Vorlese-Knopf 🔊 anzeigen</label></p>
        <div class="row"><button class="btn" id="exp">💾 Fortschritt sichern (Datei)</button><label class="btn" style="cursor:pointer">📂 Sicherung laden<input type="file" id="imp" accept=".json" hidden></label><button class="btn ghost" id="clrm">Fehler-Kiste leeren</button><button class="btn ghost" id="rst" style="color:var(--bad)">Alles zurücksetzen</button></div>
        <p class="small muted">Der Fortschritt wird nur in diesem Browser auf diesem Laptop gespeichert. Bitte ab und zu sichern – und Browserdaten/Verlauf für diese Datei nicht löschen.</p></div>
      <h2>💡 So unterstützen Sie Ihr Kind am besten</h2><div class="card"><ul style="margin:0;padding-left:22px">
        <li><b>Täglich kurz statt selten lang:</b> 15 Minuten an 5–6 Tagen pro Woche wirken mehr als eine lange Sitzung („verteiltes Üben“). Ein fester Zeitpunkt (z. B. nach der Jause) hilft.</li>
        <li><b>Anstrengung loben, nicht Talent:</b> „Du hast nicht aufgegeben!“ statt „Du bist so schlau“. Sätze wie „Ich war auch nie gut in Mathe“ bitte vermeiden – Kinder übernehmen das.</li>
        <li><b>Erklären lassen:</b> Wer etwas erklären kann, hat es verstanden. Fragen Sie: „Zeig mir, wie du das gerechnet hast.“</li>
        <li><b>Fehler sind Informationen:</b> Die Fehler-Kiste holt falsche Aufgaben später wieder hervor – genau das festigt das Wissen.</li>
        <li><b>Tipps sind erlaubt:</b> Die gestuften Hinweise ersetzen den Nachhilfelehrer, der genau im richtigen Moment hilft. Das ist kein Schummeln.</li>
        <li><b>Grundlagen zuerst:</b> Viele Probleme in der 2. Klasse kommen von unsicherem Einmaleins und Teilen. Das Kopfrechnen-Aufwärmen jeden Tag schließt diese Lücke.</li>
        <li><b>Konkret → Bild → Symbol:</b> Bei Brüchen hilft echtes Material: Pizza, Schokolade, Messbecher. Die Erklärungen in der App arbeiten mit Bildern und Schiebereglern nach demselben Prinzip.</li></ul></div>
      <h2>🧠 Wie die App unterrichtet</h2><div class="card small"><p style="margin-top:0">Jedes Thema folgt dem Ablauf guter Nachhilfe: <b>Alltagsbeispiel → interaktives Bild zum Ausprobieren → Regel („Merke“) mit typischem Fehler → vorgerechnetes Beispiel Schritt für Schritt → eigene Aufgabe → in eigenen Worten erklären</b>. Beim Üben gibt es gestufte Tipps, Rückmeldungen zu typischen Fehlern (z. B. „Nenner werden nicht addiert“) und nach zwei Versuchen den vollständigen Rechenweg. Die Schwierigkeit (Stufe 1–3) passt sich pro Thema automatisch an. Das Tagestraining mischt Aufwärmen, Wiederholung alter Fehler und die aktuellen Schulthemen (gemischtes Üben).</p>
        <p style="margin-bottom:0">Aufbau, Reihenfolge und Begriffe folgen dem Schulbuch <b>„${BOOK.title}“ (${BOOK.publisher})</b>, Kapitel A–J, mit Seitenangaben. Die Aufgaben sind eigene, ähnliche Übungen mit immer neuen Zahlen – ideal als Ergänzung zur Hausübung. Dazu kommt eine Wiederholung wichtiger Grundlagen aus der 1. Klasse.</p></div>`;
    $$('[data-f]').forEach(c => c.onchange = () => { S.settings.focus = $$('[data-f]').filter(x => x.checked).map(x => x.dataset.f); save(); });
    const exSave = () => { S.settings.exam = { name: $('#exn').value.trim() || 'Schularbeit', date: $('#exd').value, topics: $$('[data-ex]').filter(x => x.checked).map(x => x.dataset.ex) }; S.examDay = null; save(); };
    $$('[data-ex]').forEach(c => c.onchange = exSave); $('#exd').onchange = exSave; $('#exn').onchange = exSave;
    $('#exoff').onclick = () => { S.settings.exam = { name: '', date: '', topics: [] }; save(); toast('Keine Schularbeit geplant.'); VIEWS.parents(); };
    $('#goal').onchange = e => { S.settings.goal = +e.target.value; save(); header(); };
    $('#snd').onchange = e => { S.settings.sound = e.target.checked; save(); };
    $('#voi').onchange = e => { S.settings.voice = e.target.checked; save(); };
    $('#exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = `mathe-euli-sicherung-${today()}.json`; a.click(); };
    $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(txt => { try { const s = JSON.parse(txt); if (!s.topics) throw 0; S = Object.assign(defState(), s); save(); toast('✅ Sicherung geladen'); VIEWS.parents(); } catch (err) { toast('Diese Datei ist keine gültige Sicherung.'); } }); };
    $('#clrm').onclick = () => { if (confirm('Fehler-Kiste wirklich leeren?')) { S.mistakes = []; save(); VIEWS.parents(); } };
    $('#rst').onclick = () => { if (confirm('Wirklich ALLES löschen (Name, Fortschritt, Abzeichen)? Das kann nicht rückgängig gemacht werden.')) { S = defState(); save(); go('home'); } };
  },
};

/* ---------- Aktionen ---------- */
function startDaily() { go('practice', { mode: 'daily', list: buildDaily(), i: 0, res: [] }); }
function startTest() {
  const ids = (S.settings.focus.length ? S.settings.focus : BOOK.defaultFocus).filter(id => TOPIC[id]);
  const list = Array.from({ length: 10 }, (_, i) => ({ topic: ids[i % ids.length] }));
  go('practice', { mode: 'test', test: true, list: shuffle(list), i: 0, res: [] });
}
function startTopic(id) { go('practice', { mode: 'topic', topicId: id, list: Array.from({ length: 8 }, () => ({ topic: id })), i: 0, res: [] }); }
function startMistakes() {
  if (!S.mistakes.length) return toast('Deine Fehler-Kiste ist leer! 🎉');
  go('practice', { mode: 'mistakes', list: shuffle(S.mistakes).slice(0, 10).map(m => ({ topic: m.topic, task: m })), i: 0, res: [] });
}
function finishLesson(id) {
  const note = $('#note')?.value.trim(); if (note) S.notes[id] = note; else delete S.notes[id];
  const s = tp(id); if (!s.lesson) { s.lesson = true; S.lessons++; S.xp += 15; toast('📖 Erklärung geschafft! <b>+15 XP</b>'); }
  save(); checkBadges(); startTopic(id);
}
function editProfile() { header(); VIEWS.onboarding(true); }

window.addEventListener('DOMContentLoaded', async () => {
  go('home'); if ('speechSynthesis' in window) speechSynthesis.getVoices();
  if (IS_WEB && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  try { if (navigator.storage?.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) { }
  // Falls der normale Speicher leer ist, aber die zweite Sicherung noch da: Fortschritt wiederherstellen
  const b = await idbLoad();
  if (b) { try { const s = JSON.parse(b); if (s.profile && (!S.profile || (s.total || 0) > (S.total || 0))) { applyLoaded(b); try { localStorage.setItem(KEY, b); } catch (e) { } go('home'); toast(`✅ Willkommen zurück, ${esc(S.profile.name)}! Dein Fortschritt ist wieder da.`, 4000); } } catch (e) { } }
  else if (S.profile) idbSave();
});
</script>
