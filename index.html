<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathe mit Euli</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ef; --card:#ffffff; --ink:#2b2340; --muted:#7a7090; --line:#ece4f5;
  --pri:#7c4dff; --pri2:#a685ff; --pri-soft:#efe8ff;
  --ok:#16a34a; --ok-soft:#e3f8ea; --warn:#f59e0b; --warn-soft:#fff3d6;
  --bad:#e5484d; --bad-soft:#ffe8e8; --teal:#14b8a6; --coral:#ff7a6b; --sun:#ffc93c;
  --c1:#7c4dff; --c2:#ff7a6b; --c3:#14b8a6; --c4:#ffc93c;
  --r:18px; --shadow:0 4px 0 rgba(60,30,120,.08), 0 10px 30px rgba(60,30,120,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.5;min-height:100vh}
button{font:inherit;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}
b,strong{font-weight:800}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(255,248,239,.92);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--pri);background:none;border:0;padding:0}
.brand .owl{font-size:30px}
.top .sp{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:16px;white-space:nowrap}
.xpbar{width:90px;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:9px}
.avatar-btn{font-size:26px;background:var(--pri-soft);border:2px solid var(--line);border-radius:50%;width:44px;height:44px;display:grid;place-items:center}

main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:30px;margin:6px 0 14px;line-height:1.2}
h2{font-size:23px;margin:22px 0 10px}
h3{font-size:19px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:15px}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:2px solid var(--line)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}

.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;font-size:18px;background:var(--pri-soft);color:var(--pri);box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn.primary{background:var(--pri);color:#fff;box-shadow:0 4px 0 #5a2fd6}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #0f7a37}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none}
.btn.big{font-size:22px;padding:16px 28px;border-radius:18px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.icon-btn{background:var(--pri-soft);border:0;border-radius:12px;width:42px;height:42px;font-size:20px;flex:none}

/* home */
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.mascot{font-size:72px;line-height:1;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);flex:1;min-width:220px}
.ring{width:120px;height:120px;flex:none}
.tile{cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.tile:hover{transform:translateY(-3px)}
.tile .ic{font-size:36px}
.badge-n{background:var(--coral);color:#fff;border-radius:999px;padding:0 9px;font-size:14px;font-weight:900;margin-left:6px}

/* topics */
.group-title{display:flex;align-items:center;gap:8px}
.topic{cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px;transition:transform .12s}
.topic:hover{transform:translateY(-2px)}
.topic .ic{font-size:32px;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--pri-soft);flex:none}
.topic .t{font-weight:800;line-height:1.25}
.stars{color:var(--sun);letter-spacing:2px;font-size:17px}
.stars .off{color:#e2dbe9}
.mbar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:5px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--ok));border-radius:9px}
.tag{display:inline-block;font-size:13px;font-weight:800;border-radius:8px;padding:1px 8px;background:var(--warn-soft);color:#a16207;margin-left:4px}
.tag.school{background:#e0f2fe;color:#0369a1}

/* lesson */
.lesson-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--pri)}
.slide{min-height:340px;animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.slide p{margin:8px 0}
.merke{background:var(--warn-soft);border-left:6px solid var(--warn);border-radius:12px;padding:12px 16px;margin:12px 0}
.merke::before{content:"📌 Merke dir:";display:block;font-weight:900;color:#a16207;margin-bottom:4px}
.story{background:#e0f2fe;border-left:6px solid #0ea5e9;border-radius:12px;padding:12px 16px;margin:12px 0}
.oops{background:var(--bad-soft);border-left:6px solid var(--bad);border-radius:12px;padding:12px 16px;margin:12px 0}
.oops::before{content:"⚠️ Typischer Fehler:";display:block;font-weight:900;color:var(--bad);margin-bottom:4px}
.widget{background:#faf7ff;border:2px dashed var(--pri2);border-radius:16px;padding:16px;margin:14px 0;text-align:center}
.widget .ctrl{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.widget label{font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px}
.widget input[type=range]{width:180px;accent-color:var(--pri)}
.widget .out{font-size:22px;font-weight:800;margin-top:6px}
.widget-hint{font-size:14px;color:var(--pri);font-weight:800;margin-bottom:6px}
table.tbl{border-collapse:collapse;margin:10px auto}
@media (max-width:600px){table.tbl{display:block;max-width:100%;overflow-x:auto;width:max-content}table.tbl td,table.tbl th{padding:5px 8px}}
table.tbl td,table.tbl th{border:2px solid var(--line);padding:6px 12px;text-align:center}
table.tbl th{background:var(--pri-soft)}
textarea{width:100%;min-height:100px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit}

/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.1;font-weight:800}
.fr>span:first-child{border-bottom:2.5px solid currentColor;padding:0 4px}
.fr>span:last-child{padding:0 4px}

/* task */
.task-wrap{max-width:760px;margin:0 auto}
.progress{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--pri));border-radius:9px;transition:width .4s}
.task .q-row{display:flex;gap:12px;align-items:flex-start}
.task .q{font-size:23px;font-weight:700;flex:1;line-height:1.6}
.task .meta{font-size:14px;color:var(--muted);font-weight:800;margin-bottom:6px}
.visual{display:flex;justify-content:center;margin:14px 0;overflow-x:auto}
.visual svg,.card svg:not(.ring){max-width:100%;height:auto}
.answer-area{display:flex;justify-content:center;align-items:center;gap:10px;margin:18px 0;flex-wrap:wrap;font-size:24px;font-weight:800}
.ans{width:170px;font-size:26px;font-weight:800;text-align:center;border:3px solid var(--pri2);border-radius:14px;padding:8px;background:#fff;color:var(--ink)}
.ans:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-soft)}
.frac-in{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.frac-in .ans{width:96px}
.frac-in .line{width:110px;height:4px;background:var(--ink);border-radius:3px}
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.choice{min-width:96px;font-size:22px;font-weight:800;padding:12px 20px;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink)}
.choice:hover{border-color:var(--pri2)}
.choice.picked-bad{border-color:var(--bad);background:var(--bad-soft)}
.choice.picked-ok{border-color:var(--ok);background:var(--ok-soft)}
.task-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hint-box{background:var(--warn-soft);border-radius:14px;padding:10px 16px;margin:10px 0}
.hint-box div{margin:4px 0}
.hint-box div::before{content:"💡 "}
.fb{border-radius:16px;padding:14px 18px;margin:14px 0;animation:pop .25s}
.fb.ok{background:var(--ok-soft);border:2px solid #9be3b4}
.fb.try{background:var(--warn-soft);border:2px solid #fcd98a}
.fb.bad{background:#f3eeff;border:2px solid var(--pri2)}
.fb .head{font-weight:900;font-size:20px}
ol.steps{margin:10px 0;padding-left:26px}
ol.steps li{margin:6px 0;animation:pop .35s both}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.xp-pop{display:inline-block;background:var(--sun);color:#5a3b00;border-radius:999px;padding:0 10px;font-weight:900;margin-left:8px;animation:pop .3s}

/* summary & badges */
.big-emoji{font-size:80px;text-align:center}
.center{text-align:center}
.badge{text-align:center;padding:16px 10px}
.badge .ic{font-size:44px}
.badge.locked{filter:grayscale(1);opacity:.45}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:100;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:#fff;padding:12px 22px;border-radius:16px;font-weight:800;animation:pop .3s;box-shadow:var(--shadow);text-align:center}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

/* onboarding */
.avatars{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.avatars button{font-size:36px;width:64px;height:64px;border-radius:16px;border:3px solid var(--line);background:#fff}
.avatars button.on{border-color:var(--pri);background:var(--pri-soft)}
.name-in{font-size:24px;border:3px solid var(--pri2);border-radius:14px;padding:10px 16px;width:min(320px,100%);text-align:center}

/* parents */
.cal{display:flex;gap:5px;flex-wrap:wrap}
.cal i{width:26px;height:26px;border-radius:6px;background:var(--line);display:grid;place-items:center;font-size:11px;font-style:normal;color:#fff;font-weight:800}
.stat{font-size:30px;font-weight:900;color:var(--pri)}
table.ptbl{width:100%;border-collapse:collapse;font-size:15px}
table.ptbl td,table.ptbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.focus-list{columns:2;column-gap:20px;font-size:16px}
.focus-list label{display:block;break-inside:avoid;margin:3px 0}
@media (max-width:600px){
  body{font-size:17px}
  .task .q{font-size:20px}
  .xpbar,.hide-sm{display:none}
  .focus-list{columns:1}
}
</style>

<body>
<header class="top" id="top"></header>
<main id="app"></main>
<canvas id="confetti"></canvas>
<noscript>Bitte JavaScript aktivieren.</noscript>
<script>
/* ===== Hilfsfunktionen ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };
const lcm = (a, b) => a / gcd(a, b) * b;
const reduce = (n, d) => { const g = gcd(n, d) || 1; return [n / g, d / g]; };
const r6 = x => Math.round(x * 1e6) / 1e6;
const fmt = x => String(r6(x)).replace('.', ',');
const money = x => x.toFixed(2).replace('.', ',') + ' €';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Bruch als HTML; ganze Zahlen ohne Bruchstrich */
function F(n, d) { return d === 1 ? `${n}` : `<span class="fr"><span>${n}</span><span>${d}</span></span>`; }
const FA = ([n, d]) => F(n, d);

function parseNum(s) {
  s = String(s ?? '').trim().replace(/\s/g, '').replace(/€|°|%|'/g, '').replace(/[−–]/g, '-').replace(',', '.');
  if (s === '' || s === '.' || isNaN(+s)) return null;
  return +s;
}
function divisors(n) { const r = []; for (let i = 1; i <= n; i++) if (n % i === 0) r.push(i); return r; }
function isPrime(n) { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
function primeFactors(n) { const r = []; let p = 2; while (n > 1) { while (n % p === 0) { r.push(p); n /= p; } p++; } return r; }
const digitSum = n => String(n).split('').reduce((s, c) => s + +c, 0);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);

const NENNER = { 2: 'Halbe', 3: 'Drittel', 4: 'Viertel', 5: 'Fünftel', 6: 'Sechstel', 7: 'Siebtel', 8: 'Achtel', 9: 'Neuntel', 10: 'Zehntel', 12: 'Zwölftel', 20: 'Zwanzigstel', 100: 'Hundertstel' };

/* ===== SVG-Zeichnungen ===== */
const COLS = ['#7c4dff', '#ff7a6b', '#14b8a6', '#ffc93c', '#0ea5e9', '#ec4899'];

function svgPie(k, n, size = 150, col = '#7c4dff') {
  const c = size / 2, R = size / 2 - 4; let p = '';
  if (n === 1) return `<svg width="${size}" height="${size}"><circle cx="${c}" cy="${c}" r="${R}" fill="${k ? col : '#fff'}" stroke="#2b2340" stroke-width="2"/></svg>`;
  for (let i = 0; i < n; i++) {
    const a1 = -Math.PI / 2 + i * 2 * Math.PI / n, a2 = a1 + 2 * Math.PI / n;
    const x1 = c + R * Math.cos(a1), y1 = c + R * Math.sin(a1), x2 = c + R * Math.cos(a2), y2 = c + R * Math.sin(a2);
    p += `<path d="M${c},${c} L${x1},${y1} A${R},${R} 0 ${n === 1 ? 1 : 0} 1 ${x2},${y2} Z" fill="${i < k ? col : '#fff'}" stroke="#2b2340" stroke-width="2"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${p}</svg>`;
}

function svgBar(k, n, w = 320, h = 46, col = '#7c4dff', label = '') {
  let p = ''; const pw = w / n;
  for (let i = 0; i < n; i++) p += `<rect x="${2 + i * pw}" y="2" width="${pw}" height="${h}" fill="${i < k ? col : '#fff'}" stroke="#2b2340" stroke-width="2"/>`;
  const lw = label ? 70 : 0;
  return `<svg width="${w + 4 + lw}" height="${h + 4}" viewBox="0 0 ${w + 4 + lw} ${h + 4}">${p}${label ? `<text x="${w + 14}" y="${h / 2 + 9}" font-size="22" font-weight="800" fill="#2b2340">${label}</text>` : ''}</svg>`;
}

function svgGrid100(k, size = 220, col = '#14b8a6') {
  let p = ''; const s = (size - 4) / 10;
  for (let i = 0; i < 100; i++) {
    const r = Math.floor(i / 10), c = i % 10;
    p += `<rect x="${2 + c * s}" y="${2 + r * s}" width="${s}" height="${s}" fill="${i < k ? col : '#fff'}" stroke="#c9bfe0" stroke-width="1"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${p}<rect x="2" y="2" width="${size - 4}" height="${size - 4}" fill="none" stroke="#2b2340" stroke-width="2"/></svg>`;
}

function svgAngle(deg, { size = 240, label = '', col = '#7c4dff', start = 0 } = {}) {
  const cx = size / 2, cy = size / 2 + (deg <= 180 ? size * 0.18 : 0), R = size * 0.42, r = size * 0.15;
  const a0 = start * Math.PI / 180, a1 = (start + deg) * Math.PI / 180;
  const P = (rr, a) => [cx + rr * Math.cos(a), cy - rr * Math.sin(a)];
  const [x0, y0] = P(R, a0), [x1, y1] = P(R, a1), [s0x, s0y] = P(r, a0), [s1x, s1y] = P(r, a1);
  let mark;
  if (Math.abs(deg - 90) < 0.5) {
    const q = r * 0.7, [ax, ay] = P(q, a0), [bx, by] = P(q, a1), [mx, my] = P(q * Math.SQRT2, a0 + Math.PI / 4);
    mark = `<path d="M${cx},${cy} L${ax},${ay} L${mx},${my} L${bx},${by} Z" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="2"/><circle cx="${cx + (mx - cx) * .5}" cy="${cy + (my - cy) * .5}" r="2.5" fill="${col}"/>`;
  } else if (deg >= 359.5) {
    mark = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="2"/>`;
  } else {
    mark = `<path d="M${cx},${cy} L${s0x},${s0y} A${r},${r} 0 ${deg > 180 ? 1 : 0} 0 ${s1x},${s1y} Z" fill="${col}" fill-opacity=".3" stroke="${col}" stroke-width="2"/>`;
  }
  const [lx, ly] = P(r + 20, (a0 + a1) / 2);
  const h = deg <= 180 ? size * 0.75 : size;
  return `<svg width="${size}" height="${h}" viewBox="0 0 ${size} ${h}">${mark}
    <line x1="${cx}" y1="${cy}" x2="${x0}" y2="${y0}" stroke="#2b2340" stroke-width="4" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="#2b2340" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#2b2340"/>
    ${label ? `<text x="${lx}" y="${ly + 7}" text-anchor="middle" font-size="20" font-weight="800" fill="${col}">${label}</text>` : ''}</svg>`;
}

/* Dreieck aus zwei Winkeln (Grad) */
function svgTriangle(al, be, { labels = ['α', 'β', 'γ'], w = 320, h = 210, sides = null } = {}) {
  const ga = 180 - al - be, A = al * Math.PI / 180, B = be * Math.PI / 180;
  const L = 1, AC = L * Math.sin(B) / Math.sin(A + B);
  let pts = [[0, 0], [L, 0], [AC * Math.cos(A), AC * Math.sin(A)]];
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), maxy = Math.max(...ys);
  const sc = Math.min((w - 70) / (maxx - minx), (h - 60) / maxy);
  pts = pts.map(([x, y]) => [35 + (x - minx) * sc, h - 30 - y * sc]);
  const [a, b, c] = pts;
  const arc = (P, Q1, Q2, col, lab) => {
    const ang = (Q) => Math.atan2(Q[1] - P[1], Q[0] - P[0]);
    let t1 = ang(Q1), t2 = ang(Q2); const rr = 26;
    let d = t2 - t1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
    const e1 = [P[0] + rr * Math.cos(t1), P[1] + rr * Math.sin(t1)], e2 = [P[0] + rr * Math.cos(t1 + d), P[1] + rr * Math.sin(t1 + d)];
    const mid = t1 + d / 2, lp = [P[0] + (rr + 18) * Math.cos(mid), P[1] + (rr + 18) * Math.sin(mid)];
    return `<path d="M${P[0]},${P[1]} L${e1[0]},${e1[1]} A${rr},${rr} 0 0 ${d > 0 ? 1 : 0} ${e2[0]},${e2[1]} Z" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="2"/>
      <text x="${lp[0]}" y="${lp[1] + 6}" text-anchor="middle" font-size="17" font-weight="800" fill="#2b2340">${lab}</text>`;
  };
  let s = '';
  if (sides) { // Seitenbeschriftung a (BC), b (AC), c (AB)
    const m = (P, Q) => [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2];
    const [m1, m2, m3] = [m(b, c), m(a, c), m(a, b)];
    s = `<text x="${m1[0] + 12}" y="${m1[1]}" font-size="16" font-weight="700">${sides[0]}</text><text x="${m2[0] - 14}" y="${m2[1]}" text-anchor="end" font-size="16" font-weight="700">${sides[1]}</text><text x="${m3[0]}" y="${m3[1] + 22}" text-anchor="middle" font-size="16" font-weight="700">${sides[2]}</text>`;
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    ${arc(a, b, c, COLS[0], labels[0])}${arc(b, c, a, COLS[1], labels[1])}${arc(c, a, b, COLS[2], labels[2])}
    <polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#2b2340" stroke-width="3" stroke-linejoin="round"/>${s}</svg>`;
}

/* Rechteck mit Maßen, optional Kästchen */
function svgRect(a, b, unit = 'cm', grid = false) {
  const sc = Math.min(260 / a, 150 / b, 30), W = a * sc, H = b * sc;
  let g = '';
  if (grid) for (let i = 0; i < a; i++) for (let j = 0; j < b; j++) g += `<rect x="${20 + i * sc}" y="${20 + j * sc}" width="${sc}" height="${sc}" fill="none" stroke="#c9bfe0"/>`;
  return `<svg width="${W + 90}" height="${H + 60}" viewBox="0 0 ${W + 90} ${H + 60}">
    <rect x="20" y="20" width="${W}" height="${H}" fill="#efe8ff" stroke="#2b2340" stroke-width="3"/>${g}
    <text x="${20 + W / 2}" y="${H + 46}" text-anchor="middle" font-size="18" font-weight="800">${fmt(a)} ${unit}</text>
    <text x="${W + 28}" y="${20 + H / 2 + 6}" font-size="18" font-weight="800">${fmt(b)} ${unit}</text></svg>`;
}

/* Allgemeine Flächenfigur: Dreieck, Parallelogramm, Trapez mit Höhe */
function svgShape(kind, d, unit = 'cm') {
  const W = 300, H = 170, base = 220, top = 25, bot = 145;
  let poly, hx, labels = '';
  if (kind === 'dreieck') {
    const px = 20 + base * 0.62; poly = `20,${bot} ${20 + base},${bot} ${px},${top}`; hx = px;
    labels = `<text x="${20 + base / 2}" y="${bot + 22}" text-anchor="middle" font-weight="800" font-size="17">g = ${fmt(d.g)} ${unit}</text>`;
  } else if (kind === 'parallelogramm') {
    poly = `20,${bot} ${20 + base - 50},${bot} ${20 + base + 10},${top} ${70},${top}`; hx = 70;
    labels = `<text x="${20 + (base - 50) / 2}" y="${bot + 22}" text-anchor="middle" font-weight="800" font-size="17">g = ${fmt(d.g)} ${unit}</text>`;
  } else {
    poly = `20,${bot} ${20 + base},${bot} ${20 + base - 50},${top} ${80},${top}`; hx = 80;
    labels = `<text x="${20 + base / 2}" y="${bot + 22}" text-anchor="middle" font-weight="800" font-size="17">a = ${fmt(d.a)} ${unit}</text>
      <text x="${(80 + 20 + base - 50) / 2}" y="${top - 6}" text-anchor="middle" font-weight="800" font-size="17">c = ${fmt(d.c)} ${unit}</text>`;
  }
  return `<svg width="${W}" height="${H + 20}" viewBox="0 0 ${W} ${H + 20}">
    <polygon points="${poly}" fill="#e0f7f3" stroke="#2b2340" stroke-width="3" stroke-linejoin="round"/>
    <line x1="${hx}" y1="${top}" x2="${hx}" y2="${bot}" stroke="#ff7a6b" stroke-width="2.5" stroke-dasharray="6 4"/>
    <rect x="${hx}" y="${bot - 12}" width="12" height="12" fill="none" stroke="#ff7a6b" stroke-width="2"/>
    <text x="${hx + 8}" y="${(top + bot) / 2}" font-weight="800" font-size="17" fill="#e5484d">h = ${fmt(d.h)} ${unit}</text>${labels}</svg>`;
}

/* Quader in Schrägbild */
function svgCuboid(l, w, h, unit = 'cm', cubes = false) {
  const s = Math.min(170 / (l + w * 0.5), 130 / (h + w * 0.5), 34), L = l * s, Hh = h * s, D = w * s * 0.5;
  const x0 = 20, y0 = 20 + D;
  let inner = '';
  if (cubes) {
    for (let i = 1; i < l; i++) inner += `<line x1="${x0 + i * s}" y1="${y0}" x2="${x0 + i * s}" y2="${y0 + Hh}" stroke="#a685ff"/><line x1="${x0 + i * s}" y1="${y0}" x2="${x0 + i * s + D}" y2="${y0 - D}" stroke="#a685ff"/>`;
    for (let j = 1; j < h; j++) inner += `<line x1="${x0}" y1="${y0 + j * s}" x2="${x0 + L}" y2="${y0 + j * s}" stroke="#a685ff"/><line x1="${x0 + L}" y1="${y0 + j * s}" x2="${x0 + L + D}" y2="${y0 + j * s - D}" stroke="#a685ff"/>`;
    for (let k = 1; k < w; k++) { const dx = D * k / w; inner += `<line x1="${x0 + dx}" y1="${y0 - dx}" x2="${x0 + L + dx}" y2="${y0 - dx}" stroke="#a685ff"/><line x1="${x0 + L + dx}" y1="${y0 - dx}" x2="${x0 + L + dx}" y2="${y0 + Hh - dx}" stroke="#a685ff"/>`; }
  }
  const W = L + D + 110, HT = Hh + D + 60;
  return `<svg width="${W}" height="${HT}" viewBox="0 0 ${W} ${HT}">
    <polygon points="${x0},${y0} ${x0 + D},${y0 - D} ${x0 + L + D},${y0 - D} ${x0 + L},${y0}" fill="#d9ccff" stroke="#2b2340" stroke-width="2.5"/>
    <polygon points="${x0 + L},${y0} ${x0 + L + D},${y0 - D} ${x0 + L + D},${y0 + Hh - D} ${x0 + L},${y0 + Hh}" fill="#c4b2ff" stroke="#2b2340" stroke-width="2.5"/>
    <rect x="${x0}" y="${y0}" width="${L}" height="${Hh}" fill="#efe8ff" stroke="#2b2340" stroke-width="2.5"/>${inner}
    <text x="${x0 + L / 2}" y="${y0 + Hh + 24}" text-anchor="middle" font-weight="800" font-size="17">${fmt(l)} ${unit}</text>
    <text x="${x0 + L + D / 2 + 10}" y="${y0 + Hh - D / 2 + 22}" font-weight="800" font-size="17">${fmt(w)} ${unit}</text>
    <text x="${x0 + L + D + 8}" y="${y0 - D + Hh / 2}" font-weight="800" font-size="17">${fmt(h)} ${unit}</text></svg>`;
}

/* Balkenwaage: a·x + b = c */
function svgBalance(a, b, c, tilt = 0) {
  const W = 420, H = 230, cx = W / 2, by = 70, t = tilt * 8;
  const pan = (x, y, items) => `<line x1="${x}" y1="${y}" x2="${x - 70}" y2="${y + 60}" stroke="#7a7090" stroke-width="2"/><line x1="${x}" y1="${y}" x2="${x + 70}" y2="${y + 60}" stroke="#7a7090" stroke-width="2"/>
    <path d="M${x - 85},${y + 60} Q${x},${y + 85} ${x + 85},${y + 60} Z" fill="#ffe7a8" stroke="#2b2340" stroke-width="2"/>${items(x, y + 58)}`;
  const stack = (xbox, units) => (x, y) => {
    let s = '', all = [];
    for (let i = 0; i < xbox; i++) all.push('x');
    if (units > 12) all.push('U' + units); else for (let i = 0; i < units; i++) all.push('u');
    const per = 6; let i = 0;
    all.forEach(it => {
      const col = i % per, row = Math.floor(i / per), px = x - 75 + col * 26, py = y - 26 - row * 26;
      if (it === 'x') s += `<rect x="${px}" y="${py}" width="24" height="24" rx="4" fill="#7c4dff"/><text x="${px + 12}" y="${py + 18}" text-anchor="middle" fill="#fff" font-weight="900" font-size="16">x</text>`;
      else if (it === 'u') s += `<circle cx="${px + 12}" cy="${py + 13}" r="10" fill="#ff7a6b" stroke="#c2410c"/><text x="${px + 12}" y="${py + 18}" text-anchor="middle" fill="#fff" font-weight="900" font-size="13">1</text>`;
      else { s += `<rect x="${px}" y="${py - 4}" width="50" height="28" rx="6" fill="#ff7a6b" stroke="#c2410c"/><text x="${px + 25}" y="${py + 16}" text-anchor="middle" fill="#fff" font-weight="900" font-size="16">${it.slice(1)}</text>`; i++; }
      i++;
    });
    return s;
  };
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <polygon points="${cx - 22},${H - 8} ${cx + 22},${H - 8} ${cx},${by}" fill="#7a7090"/>
    <line x1="${cx - 140}" y1="${by + t}" x2="${cx + 140}" y2="${by - t}" stroke="#2b2340" stroke-width="6" stroke-linecap="round"/>
    ${pan(cx - 120, by + t, stack(a, b))}${pan(cx + 120, by - t, stack(0, c))}
    <circle cx="${cx}" cy="${by}" r="7" fill="#2b2340"/></svg>`;
}

function svgBarChart(labels, vals, unit = '') {
  const W = 420, H = 240, max = Math.max(...vals), top = Math.ceil(max / 5) * 5 || 5, bw = (W - 70) / vals.length;
  let s = '';
  for (let v = 0; v <= top; v += top / 5) { const y = H - 40 - (v / top) * (H - 70); s += `<line x1="40" y1="${y}" x2="${W - 10}" y2="${y}" stroke="#ece4f5"/><text x="34" y="${y + 5}" text-anchor="end" font-size="13" fill="#7a7090">${fmt(v)}</text>`; }
  vals.forEach((v, i) => {
    const hh = (v / top) * (H - 70), x = 48 + i * bw;
    s += `<rect x="${x}" y="${H - 40 - hh}" width="${bw - 16}" height="${hh}" rx="4" fill="${COLS[i % COLS.length]}"/>
      <text x="${x + (bw - 16) / 2}" y="${H - 20}" text-anchor="middle" font-size="14" font-weight="700">${labels[i]}</text>`;
  });
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}<line x1="40" y1="${H - 40}" x2="${W - 10}" y2="${H - 40}" stroke="#2b2340" stroke-width="2"/></svg>`;
}

/* zwei sich schneidende Geraden für Neben-/Scheitelwinkel */
function svgCross(alpha, ask = 'β', pos = 'neben') {
  const W = 300, H = 200, cx = 150, cy = 100, R = 120, a = alpha * Math.PI / 180;
  const P = (ang, r = R) => [cx + r * Math.cos(ang), cy - r * Math.sin(ang)];
  const [x1, y1] = P(a), [x2, y2] = P(a + Math.PI);
  const sector = (t0, t1, col, lab) => { const r = 32, [ax, ay] = P(t0, r), [bx, by] = P(t1, r), [lx, ly] = P((t0 + t1) / 2, r + 20); return `<path d="M${cx},${cy} L${ax},${ay} A${r},${r} 0 0 0 ${bx},${by} Z" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="2"/><text x="${lx}" y="${ly + 6}" text-anchor="middle" font-weight="800" font-size="18">${lab}</text>`; };
  const other = pos === 'neben' ? sector(a, Math.PI, COLS[1], ask) : sector(Math.PI, Math.PI + a, COLS[1], ask);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${sector(0, a, COLS[0], 'α')}${other}
    <line x1="${cx - R - 20}" y1="${cy}" x2="${cx + R + 20}" y2="${cy}" stroke="#2b2340" stroke-width="3"/>
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2b2340" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="4"/></svg>`;
}

/* ===== Erweiterungen für „Das ist Mathematik 2“ ===== */
const Fr = {
  add: ([a, b], [c, d]) => reduce(a * d + c * b, b * d), sub: ([a, b], [c, d]) => reduce(a * d - c * b, b * d),
  mul: ([a, b], [c, d]) => reduce(a * c, b * d), div: ([a, b], [c, d]) => reduce(a * d, b * c),
};
const neg = x => x < 0 ? `(−${-x})` : `${x}`;           // Zahl mit Klammer, falls negativ
const sg = x => x < 0 ? `−${-x}` : `${x}`;               // Zahl mit echtem Minuszeichen
const pt = (x, y) => `(${sg(x)}|${sg(y)})`;

/* Koordinatensystem; Rückgabe-SVG ist klickbar (data-* für Umrechnung) */
function svgCoord({ min = -6, max = 6, pts = [], sel = null, good = null, size = 340, hl = null, poly = null } = {}) {
  const n = max - min, pad = 26, s = (size - 2 * pad) / n;
  const X = x => pad + (x - min) * s, Y = y => size - pad - (y - min) * s;
  let g = '';
  for (let i = min; i <= max; i++) {
    g += `<line x1="${X(i)}" y1="${Y(min)}" x2="${X(i)}" y2="${Y(max)}" stroke="#e6def3"/><line x1="${X(min)}" y1="${Y(i)}" x2="${X(max)}" y2="${Y(i)}" stroke="#e6def3"/>`;
    if (i) g += `<text x="${X(i)}" y="${Y(Math.max(min, 0)) + 15}" font-size="11" text-anchor="middle" fill="#7a7090">${sg(i)}</text><text x="${X(Math.max(min, 0)) - 5}" y="${Y(i) + 4}" font-size="11" text-anchor="end" fill="#7a7090">${sg(i)}</text>`;
  }
  const ox = X(Math.max(min, 0)), oy = Y(Math.max(min, 0));
  g += `<line x1="${X(min)}" y1="${oy}" x2="${X(max) + 12}" y2="${oy}" stroke="${hl === 'x' ? '#ff7a6b' : '#2b2340'}" stroke-width="${hl === 'x' ? 4 : 2}"/><line x1="${ox}" y1="${Y(min)}" x2="${ox}" y2="${Y(max) - 12}" stroke="${hl === 'y' ? '#ff7a6b' : '#2b2340'}" stroke-width="${hl === 'y' ? 4 : 2}"/>
    <polygon points="${X(max) + 16},${oy} ${X(max) + 6},${oy - 5} ${X(max) + 6},${oy + 5}"/><polygon points="${ox},${Y(max) - 16} ${ox - 5},${Y(max) - 6} ${ox + 5},${Y(max) - 6}"/>
    <text x="${X(max) + 8}" y="${oy - 8}" font-weight="800" font-size="14">x</text><text x="${ox + 8}" y="${Y(max) - 6}" font-weight="800" font-size="14">y</text><text x="${ox - 6}" y="${oy + 14}" font-size="11" text-anchor="end">0</text>`;
  if (poly) g += `<polygon points="${poly.map(([x, y]) => X(x) + ',' + Y(y)).join(' ')}" fill="#7c4dff" fill-opacity=".15" stroke="#7c4dff" stroke-width="2"/>`;
  pts.forEach(p => g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="6" fill="${p.col || '#7c4dff'}"/><text x="${X(p.x) + 9}" y="${Y(p.y) - 8}" font-weight="900" font-size="16" fill="${p.col || '#7c4dff'}">${p.label || ''}</text>`);
  if (good) g += `<circle cx="${X(good[0])}" cy="${Y(good[1])}" r="10" fill="none" stroke="#16a34a" stroke-width="4"/>`;
  if (sel) g += `<circle cx="${X(sel[0])}" cy="${Y(sel[1])}" r="7" fill="#ff7a6b" stroke="#fff" stroke-width="2"/><text x="${X(sel[0]) + 10}" y="${Y(sel[1]) + 18}" font-size="13" font-weight="800" fill="#e5484d">${pt(sel[0], sel[1])}</text>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" data-kind="coord" data-min="${min}" data-max="${max}" data-pad="${pad}" data-size="${size}" style="cursor:crosshair;max-width:100%">${g}</svg>`;
}

/* Zahlenstrahl / Zahlengerade; sub = Unterteilungen pro Einheit */
function svgNumLine({ min = -10, max = 10, sub = 1, sel = null, good = null, mark = null, jump = null, frac = false } = {}) {
  const W = 600, pad = 24, H = jump ? 120 : 80, ly = H - 40, u = (W - 2 * pad) / (max - min), X = v => pad + (v - min) * u;
  let g = `<line x1="${pad - 10}" y1="${ly}" x2="${W - pad + 14}" y2="${ly}" stroke="#2b2340" stroke-width="2.5"/><polygon points="${W - pad + 18},${ly} ${W - pad + 8},${ly - 5} ${W - pad + 8},${ly + 5}"/>`;
  for (let k = 0; k <= (max - min) * sub; k++) {
    const v = min + k / sub, major = k % sub === 0, x = X(v);
    g += `<line x1="${x}" y1="${ly - (major ? 11 : 6)}" x2="${x}" y2="${ly + (major ? 11 : 6)}" stroke="#2b2340" stroke-width="${major ? 2 : 1}"/>`;
    if (major) g += `<text x="${x}" y="${ly + 28}" text-anchor="middle" font-size="14" font-weight="700">${sg(Math.round(v))}</text>`;
  }
  if (jump) {
    const [a, b] = jump, xa = X(a), xb = X(b), up = ly - 14, top = ly - 14 - Math.min(60, Math.abs(xb - xa) / 2 + 12);
    g += `<path d="M${xa},${up} Q${(xa + xb) / 2},${top} ${xb},${up}" fill="none" stroke="#ff7a6b" stroke-width="3"/><polygon points="${xb},${up + 2} ${xb + (xb > xa ? -9 : 9)},${up - 7} ${xb + (xb > xa ? -1 : 1)},${up - 10}" fill="#ff7a6b"/>
      <text x="${(xa + xb) / 2}" y="${top + 8}" text-anchor="middle" font-weight="900" font-size="16" fill="#e5484d">${b - a > 0 ? '+' : '−'}${Math.abs(b - a)}</text><circle cx="${xa}" cy="${ly}" r="6" fill="#7c4dff"/>`;
  }
  if (mark !== null) g += `<circle cx="${X(mark)}" cy="${ly}" r="8" fill="#7c4dff"/><text x="${X(mark)}" y="${ly - 16}" text-anchor="middle" font-weight="900" font-size="16" fill="#7c4dff">?</text>`;
  if (good !== null) g += `<circle cx="${X(good)}" cy="${ly}" r="11" fill="none" stroke="#16a34a" stroke-width="4"/>`;
  if (sel !== null) g += `<circle cx="${X(sel)}" cy="${ly}" r="8" fill="#ff7a6b" stroke="#fff" stroke-width="2"/>`;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" data-kind="line" data-min="${min}" data-max="${max}" data-sub="${sub}" data-pad="${pad}" data-w="${W}" style="cursor:pointer;max-width:620px">${g}</svg>`;
}

/* zwei parallele Geraden g ∥ h mit Schnittgerade; α bei S1 (Feld 0), gefragter Winkel bei S2 in Feld pos */
function svgParallel(a, pos, lab = 'β') {
  const W = 360, H = 240, y1 = 75, y2 = 175, t = Math.tan(a * Math.PI / 180), x1 = 180 + 50 / t, x2 = x1 - 100 / t;
  const P = (x, y, ang, r) => [x + r * Math.cos(ang * Math.PI / 180), y - r * Math.sin(ang * Math.PI / 180)];
  const sec = (x, y, k, col, l) => {
    const [s, e] = [[0, a], [a, 180], [180, 180 + a], [180 + a, 360]][k], r = 28;
    const [ax, ay] = P(x, y, s, r), [bx, by] = P(x, y, e, r), [lx, ly] = P(x, y, (s + e) / 2, r + 17);
    return `<path d="M${x},${y} L${ax},${ay} A${r},${r} 0 0 0 ${bx},${by} Z" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="2"/><text x="${lx}" y="${ly + 6}" text-anchor="middle" font-weight="900" font-size="17">${l}</text>`;
  };
  const [ta, tb] = [P(x1, y1, a, 70), P(x2, y2, 180 + a, 70)];
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${sec(x1, y1, 0, COLS[0], 'α')}${sec(x2, y2, pos, COLS[1], lab)}
    <line x1="10" y1="${y1}" x2="${W - 10}" y2="${y1}" stroke="#2b2340" stroke-width="3"/><line x1="10" y1="${y2}" x2="${W - 10}" y2="${y2}" stroke="#2b2340" stroke-width="3"/>
    <text x="${W - 22}" y="${y1 - 8}" font-weight="800">g</text><text x="${W - 22}" y="${y2 - 8}" font-weight="800">h</text><text x="16" y="${(y1 + y2) / 2 + 5}" font-size="14" fill="#7a7090">g ∥ h</text>
    <line x1="${ta[0]}" y1="${ta[1]}" x2="${tb[0]}" y2="${tb[1]}" stroke="#2b2340" stroke-width="3"/></svg>`;
}

function svgLineChart(labels, vals, unit = '') {
  const W = 440, H = 240, lo = Math.min(0, ...vals), hi = Math.max(...vals), top = Math.ceil(hi / 5) * 5 || 5, bot = Math.floor(lo / 5) * 5;
  const X = i => 50 + i * (W - 80) / (vals.length - 1), Y = v => H - 40 - (v - bot) / (top - bot) * (H - 70);
  let s = '';
  for (let v = bot; v <= top; v += 5) s += `<line x1="44" y1="${Y(v)}" x2="${W - 20}" y2="${Y(v)}" stroke="${v === 0 ? '#2b2340' : '#ece4f5'}"/><text x="38" y="${Y(v) + 5}" text-anchor="end" font-size="13" fill="#7a7090">${sg(v)}${unit}</text>`;
  s += `<polyline points="${vals.map((v, i) => X(i) + ',' + Y(v)).join(' ')}" fill="none" stroke="#7c4dff" stroke-width="3"/>`;
  vals.forEach((v, i) => s += `<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="#7c4dff"/><text x="${X(i)}" y="${H - 18}" text-anchor="middle" font-size="13" font-weight="700">${labels[i]}</text>`);
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

/* Raute / Drachenviereck mit Diagonalen e (waagrecht) und f (senkrecht) */
function svgKite(kind, e, f, unit = 'cm') {
  const W = 300, H = 220, cx = 150, cy = 105, E = 220, F = 170, top = cy - F / 2, bot = cy + F / 2, my = kind === 'raute' ? cy : top + F * 0.3;
  const pts = kind === 'raute' ? [[cx - E / 2, cy], [cx, top], [cx + E / 2, cy], [cx, bot]] : [[cx - E / 2, my], [cx, top], [cx + E / 2, my], [cx, bot]];
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="#e0f7f3" stroke="#2b2340" stroke-width="3"/>
    <line x1="${cx - E / 2}" y1="${my}" x2="${cx + E / 2}" y2="${my}" stroke="#ff7a6b" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="${cx}" y1="${top}" x2="${cx}" y2="${bot}" stroke="#7c4dff" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="${cx + 50}" y="${my - 6}" font-weight="800" fill="#e5484d">e = ${fmt(e)} ${unit}</text><text x="${cx + 6}" y="${bot - 14}" font-weight="800" fill="#7c4dff">f = ${fmt(f)} ${unit}</text></svg>`;
}

/* Figuren für Symmetrie-Aufgaben */
const FIGS = {
  'Quadrat': [[0, 0], [1, 0], [1, 1], [0, 1]], 'Rechteck': [[0, 0], [1.6, 0], [1.6, 1], [0, 1]],
  'gleichseitiges Dreieck': [[0, 0], [1, 0], [0.5, 0.866]], 'gleichschenkliges Dreieck': [[0, 0], [1, 0], [0.5, 1.3]],
  'Raute': [[0, 0.6], [0.8, 0], [1.6, 0.6], [0.8, 1.2]], 'Drachenviereck (Deltoid)': [[0, 0.9], [0.6, 0], [1.2, 0.9], [0.6, 1.3]],
  'gleichschenkliges Trapez': [[0, 0], [1.6, 0], [1.2, 0.9], [0.4, 0.9]], 'Parallelogramm': [[0, 0], [1.3, 0], [1.7, 0.9], [0.4, 0.9]],
  'regelmäßiges Sechseck': Array.from({ length: 6 }, (_, i) => [0.8 + 0.8 * Math.cos(i * Math.PI / 3), 0.7 + 0.8 * Math.sin(i * Math.PI / 3)]),
};
function svgFig(name) {
  const p = FIGS[name], xs = p.map(q => q[0]), ys = p.map(q => q[1]), sc = Math.min(200 / (Math.max(...xs) - Math.min(...xs)), 140 / (Math.max(...ys) - Math.min(...ys)));
  const pts = p.map(([x, y]) => [20 + (x - Math.min(...xs)) * sc, 160 - (y - Math.min(...ys)) * sc]);
  return `<svg width="250" height="180" viewBox="0 0 250 180"><polygon points="${pts.map(q => q.join(',')).join(' ')}" fill="#efe8ff" stroke="#2b2340" stroke-width="3" stroke-linejoin="round"/></svg>`;
}
</script>
<script>
/* ===== Interaktive Lern-Widgets für die Erklärungen ===== */
function slider(id, label, min, max, val, step = 1) {
  return `<label>${label}<input type="range" data-k="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><span data-v="${id}">${val}</span></label>`;
}
function bindSliders(el, draw) {
  const get = () => { const o = {}; $$('input[type=range]', el).forEach(i => { o[i.dataset.k] = +i.value; const v = $(`[data-v="${i.dataset.k}"]`, el); if (v) v.textContent = i.value; }); return o; };
  $$('input[type=range]', el).forEach(i => i.addEventListener('input', () => draw(get())));
  draw(get());
}

const WIDGETS = {
  pie(el) {
    el.innerHTML = `<div class="widget-hint">👆 Schieb die Regler!</div><div class="ctrl">${slider('n', 'Nenner (Teile gesamt)', 1, 12, 4)}${slider('k', 'Zähler (gefärbt)', 0, 12, 3)}</div><div class="row" style="justify-content:center" data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ n, k }) => {
      const kk = $('[data-k=k]', el); kk.max = n; if (k > n) { k = n; kk.value = n; $('[data-v=k]', el).textContent = n; }
      $('[data-o]', el).innerHTML = svgPie(k, n, 160) + svgBar(k, n, 260, 46);
      $('[data-t]', el).innerHTML = `${F(k, n)} &nbsp;→ ${k} von ${n} gleich großen Teilen ${k === n ? ' = 1 Ganzes! 🎉' : ''}`;
    });
  },
  expand(el, { a = 2, b = 3 } = {}) {
    el.innerHTML = `<div class="widget-hint">👆 Zerschneide jedes Stück in mehr Teile:</div><div class="ctrl">${slider('k', 'Erweitern mit', 1, 5, 1)}</div><div data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ k }) => {
      $('[data-o]', el).innerHTML = svgBar(a, b, 300, 40) + '<br>' + svgBar(a * k, b * k, 300, 40, '#14b8a6');
      $('[data-t]', el).innerHTML = `${F(a, b)} = ${F(`${a}·${k}`, `${b}·${k}`)} = ${F(a * k, b * k)} &nbsp; <span class="muted small">Gleich viel gefärbt!</span>`;
    });
  },
  compare(el) {
    el.innerHTML = `<div class="widget-hint">👆 Stell zwei Brüche ein und vergleiche:</div><div class="ctrl">${slider('a', 'Zähler 1', 0, 12, 2)}${slider('b', 'Nenner 1', 1, 12, 3)}</div><div class="ctrl">${slider('c', 'Zähler 2', 0, 12, 3)}${slider('d', 'Nenner 2', 1, 12, 5)}</div><div data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ a, b, c, d }) => {
      a = Math.min(a, b * 1); c = Math.min(c, d);
      $('[data-o]', el).innerHTML = svgBar(a, b, 300, 40) + '<br>' + svgBar(c, d, 300, 40, '#ff7a6b');
      const s = a * d === c * b ? '=' : a * d > c * b ? '>' : '<';
      $('[data-t]', el).innerHTML = `${F(a, b)} <span style="font-size:32px;color:var(--pri)">${s}</span> ${F(c, d)}`;
    });
  },
  areamodel(el) {
    el.innerHTML = `<div class="widget-hint">👆 ${'Bruch mal Bruch = Teil von einem Teil'}</div><div class="ctrl">${slider('a', 'Zähler 1', 1, 6, 2)}${slider('b', 'Nenner 1', 1, 6, 3)}${slider('c', 'Zähler 2', 1, 6, 3)}${slider('d', 'Nenner 2', 1, 6, 4)}</div><div data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ a, b, c, d }) => {
      a = Math.min(a, b); c = Math.min(c, d);
      const S = 240, cw = S / b, rh = S / d; let s = '';
      for (let i = 0; i < b; i++) for (let j = 0; j < d; j++) {
        const inA = i < a, inC = j < c;
        s += `<rect x="${2 + i * cw}" y="${2 + j * rh}" width="${cw}" height="${rh}" fill="${inA && inC ? '#7c4dff' : inA ? '#d9ccff' : inC ? '#ffd6d0' : '#fff'}" stroke="#2b2340" stroke-width="1.5"/>`;
      }
      $('[data-o]', el).innerHTML = `<svg width="${S + 4}" height="${S + 4}">${s}</svg>`;
      $('[data-t]', el).innerHTML = `${F(a, b)} · ${F(c, d)} = ${F(`${a}·${c}`, `${b}·${d}`)} = ${F(a * c, b * d)} <div class="small muted">Dunkle Kästchen: ${a * c} von ${b * d}</div>`;
    });
  },
  divide(el) {
    el.innerHTML = `<div class="widget-hint">👆 Wie viele Stücke bekommst du?</div><div class="ctrl">${slider('n', 'Ganze (z.B. Pizzen)', 1, 4, 3)}${slider('d', 'Stückgröße 1/…', 2, 8, 4)}</div><div class="row" style="justify-content:center" data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ n, d }) => {
      let s = ''; for (let i = 0; i < n; i++) s += svgPie(d, d, 110, COLS[i % 4]);
      $('[data-o]', el).innerHTML = s;
      $('[data-t]', el).innerHTML = `${n} : ${F(1, d)} = ${n} · ${d} = ${n * d} Stücke`;
    });
  },
  divisors(el) {
    el.innerHTML = `<div class="widget-hint">👆 Lege Plättchen zu Rechtecken!</div><div class="ctrl">${slider('n', 'Anzahl Plättchen', 1, 36, 12)}</div><div class="row" style="justify-content:center;align-items:flex-end" data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ n }) => {
      const ds = divisors(n); let s = '';
      ds.filter(a => a <= n / a).forEach(a => {
        const b = n / a, sz = Math.max(5, Math.min(14, 140 / b)); let r = '';
        for (let i = 0; i < b; i++) for (let j = 0; j < a; j++) r += `<rect x="${i * sz}" y="${j * sz}" width="${sz - 1}" height="${sz - 1}" rx="2" fill="#7c4dff"/>`;
        s += `<div style="text-align:center;margin:6px"><svg width="${b * sz}" height="${a * sz}">${r}</svg><div class="small"><b>${a} · ${b}</b></div></div>`;

      $('[data-t]', el).innerHTML = `Teiler von ${n}: <span style="color:var(--pri)">${ds.join(', ')}</span>${isPrime(n) ? '<br>⭐ Nur ein Rechteck: ' + n + ' ist eine <b>Primzahl</b>!' : n === 1 ? '<br>(1 ist keine Primzahl)' : ''}`;
    });
  },
  ggtkgv(el) {
    el.innerHTML = `<div class="ctrl">${slider('a', 'Zahl a', 2, 24, 6)}${slider('b', 'Zahl b', 2, 24, 8)}</div><div data-o style="text-align:left;max-width:620px;margin:auto"></div>`;
    const chip = (v, on) => `<span style="display:inline-block;min-width:34px;margin:2px;padding:2px 6px;border-radius:8px;font-weight:800;background:${on ? '#7c4dff' : '#fff'};color:${on ? '#fff' : '#2b2340'};border:2px solid ${on ? '#7c4dff' : '#ece4f5'}">${v}</span>`;
    bindSliders(el, ({ a, b }) => {
      const da = divisors(a), db = divisors(b), g = gcd(a, b), L = lcm(a, b);
      const ma = [], mb = []; for (let i = a; i <= Math.max(L, 24) && ma.length < 14; i += a) ma.push(i); for (let i = b; i <= Math.max(L, 24) && mb.length < 14; i += b) mb.push(i);
      $('[data-o]', el).innerHTML = `<b>Teiler</b><div>${a}: ${da.map(v => chip(v, db.includes(v))).join('')}</div><div>${b}: ${db.map(v => chip(v, da.includes(v))).join('')}</div>
        <div class="merke" style="margin:8px 0">Größter gemeinsamer Teiler: <b>ggT = ${g}</b></div>
        <b>Vielfache</b><div>${a}: ${ma.map(v => chip(v, v % b === 0)).join('')}</div><div>${b}: ${mb.map(v => chip(v, v % a === 0)).join('')}</div>
        <div class="merke" style="margin:8px 0">Kleinstes gemeinsames Vielfaches: <b>kgV = ${L}</b></div>`;
    });
  },
  placevalue(el) {
    el.innerHTML = `<div class="widget-hint">👆 Tippe eine Kommazahl ein:</div><input class="ans" value="352,47" data-in><div data-o></div>`;
    const draw = () => {
      const v = String($('[data-in]', el).value).replace('.', ',');
      let [ip, dp = ''] = v.split(','); ip = ip.replace(/\D/g, '').slice(-4).padStart(4, ' '); dp = dp.replace(/\D/g, '').slice(0, 3).padEnd(3, ' ');
      const H = ['T', 'H', 'Z', 'E', 'z', 'h', 't'], N = ['Tausender', 'Hunderter', 'Zehner', 'Einer', 'Zehntel', 'Hundertstel', 'Tausendstel'], d = (ip + dp).split('');
      $('[data-o]', el).innerHTML = `<table class="tbl"><tr>${H.map((h, i) => `<th title="${N[i]}" style="${i > 3 ? 'background:#e0f7f3' : ''}">${h}${i === 3 ? ' ,' : ''}</th>`).join('')}</tr><tr>${d.map(c => `<td style="font-size:26px;font-weight:900">${c.trim()}</td>`).join('')}</tr></table>
        <div class="small muted">E = Einer · z = Zehntel (${F(1, 10)}) · h = Hundertstel (${F(1, 100)}) · t = Tausendstel (${F(1, 1000)})</div>`;
    };
    $('[data-in]', el).addEventListener('input', draw); draw();
  },
  numberline(el) {
    el.innerHTML = `<div class="widget-hint">👆 Schieb den Punkt auf dem Zahlenstrahl:</div><div class="ctrl">${slider('v', 'Hundertstel', 0, 100, 25)}</div><div data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ v }) => {
      const W = 560, x0 = 20, x = x0 + v / 100 * (W - 40); let t = '';
      for (let i = 0; i <= 100; i++) { const xi = x0 + i / 100 * (W - 40), h = i % 10 === 0 ? 18 : i % 5 === 0 ? 11 : 6; t += `<line x1="${xi}" y1="${50 - h}" x2="${xi}" y2="${50 + h}" stroke="#2b2340" stroke-width="${i % 10 ? 1 : 2}"/>`; if (i % 10 === 0) t += `<text x="${xi}" y="88" text-anchor="middle" font-size="13">${fmt(i / 100)}</text>`; }
      $('[data-o]', el).innerHTML = `<svg width="100%" viewBox="0 0 ${W} 100">${t}<circle cx="${x}" cy="50" r="9" fill="#ff7a6b" stroke="#fff" stroke-width="3"/></svg>`;
      const [n, d] = reduce(v, 100);
      $('[data-t]', el).innerHTML = `${fmt(v / 100)} = ${F(v, 100)}${d !== 100 && v ? ' = ' + F(n, d) : ''}`;
    });
  },
  percent(el) {
    el.innerHTML = `<div class="widget-hint">👆 Färbe Kästchen im Hunderterfeld:</div><div class="ctrl">${slider('k', 'Kästchen', 0, 100, 25)}</div><div class="row" style="justify-content:center" data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ k }) => {
      $('[data-o]', el).innerHTML = svgGrid100(k);
      const [n, d] = reduce(k, 100);
      $('[data-t]', el).innerHTML = `${k} % = ${F(k, 100)}${d !== 100 && k ? ' = ' + F(n, d) : ''} = ${fmt(k / 100)}<div class="small muted">Beispiel: ${k} % von 200 € = ${fmt(k * 2)} €</div>`;
    });
  },
  direkt(el) {
    el.innerHTML = `<div class="widget-hint">👆 Je mehr Eis, desto teurer:</div><div class="ctrl">${slider('p', 'Preis für 1 Kugel (€)', 1, 3, 2, 0.5)}${slider('n', 'Anzahl Kugeln', 1, 8, 3)}</div><div data-o style="font-size:30px;min-height:46px"></div><div data-t></div>`;
    bindSliders(el, ({ p, n }) => {
      $('[data-o]', el).innerHTML = '🍦'.repeat(n);
      let rows = ''; for (let i = 1; i <= 8; i++) rows += `<tr style="${i === n ? 'background:#efe8ff;font-weight:900' : ''}"><td>${i}</td><td>${money(i * p)}</td></tr>`;
      $('[data-t]', el).innerHTML = `<table class="tbl"><tr><th>Kugeln</th><th>Preis</th></tr>${rows}</table><div class="small">Doppelt so viele Kugeln → doppelter Preis</div>`;
    });
  },
  indirekt(el) {
    const ds = [1, 2, 3, 4, 6, 8, 12, 24];
    el.innerHTML = `<div class="widget-hint">👆 24 Gummibärchen werden fair verteilt:</div><div class="ctrl">${slider('i', 'Kinder', 0, 7, 2)}</div><div data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ i }) => {
      const n = ds[i]; $('[data-v=i]', el).textContent = n;
      let s = ''; for (let j = 0; j < n; j++) s += `<div style="display:inline-block;margin:4px;text-align:center;font-size:26px">🧒<div style="font-size:13px">${'🐻'.repeat(Math.min(24 / n, 12))}${24 / n > 12 ? '…' : ''}</div></div>`;
      $('[data-o]', el).innerHTML = s;
      $('[data-t]', el).innerHTML = `${n} Kinder → jedes bekommt ${24 / n} Stück<div class="small muted">${n} · ${24 / n} = 24 &nbsp; (Das Produkt bleibt immer gleich!)</div>`;
    });
  },
  balance(el, { a = 2, b = 3, c = 11 } = {}) {
    let s = { a, b, c }, log = [`${a}x + ${b} = ${c}`];
    el.innerHTML = `<div class="widget-hint">👆 Mach auf BEIDEN Seiten das Gleiche, bis x alleine ist!</div><div data-o></div><div class="out" data-t></div>
      <div class="row" style="justify-content:center;margin-top:8px"><button class="btn" data-op="sub">− ${b} auf beiden Seiten</button><button class="btn" data-op="div">: ${a} auf beiden Seiten</button><button class="btn ghost" data-op="reset">↺ Neu</button></div><div class="small muted" data-log></div>`;
    const eq = () => `${s.a === 1 ? '' : s.a}x${s.b ? ' + ' + s.b : ''} = ${fmt(s.c)}`;
    const draw = (msg = '') => {
      $('[data-o]', el).innerHTML = svgBalance(s.a, s.b, Math.round(s.c) === s.c ? s.c : 0);
      $('[data-t]', el).innerHTML = (s.a === 1 && s.b === 0 ? `🎉 x = ${fmt(s.c)} — gelöst!` : eq()) + (msg ? `<div class="small" style="color:var(--bad)">${msg}</div>` : '');
      const [sb, dv] = $$('[data-op]', el);
      sb.textContent = `− ${s.b} auf beiden Seiten`; sb.disabled = !s.b;
      dv.textContent = `: ${s.a} auf beiden Seiten`;
      dv.disabled = s.a === 1;
      $('[data-log]', el).innerHTML = log.join(' &nbsp;→&nbsp; ');
    };
    $$('[data-op]', el).forEach(btn => btn.onclick = () => {
      const op = btn.dataset.op;
      if (op === 'reset') { s = { a, b, c }; log = [eq()]; return draw(); }
      if (op === 'sub') { s.c -= s.b; s.b = 0; log.push(eq()); return draw(); }
      if (op === 'div') {
        if (s.b) return draw('Tipp: Nimm zuerst die einzelnen Gewichte weg!');
        s.c = s.c / s.a; s.a = 1; log.push(eq()); return draw();
      }
    });
    draw();
  },
  angle(el) {
    el.innerHTML = `<div class="widget-hint">👆 Dreh den Schenkel!</div><div class="ctrl">${slider('d', 'Winkel in Grad', 0, 360, 60, 5)}</div><div data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ d }) => {
      $('[data-o]', el).innerHTML = svgAngle(Math.max(d, 1), { size: 260, label: d + '°' });
      const t = d === 0 ? 'Nullwinkel' : d < 90 ? '🔺 spitzer Winkel (kleiner als 90°)' : d === 90 ? '📐 rechter Winkel (genau 90°)' : d < 180 ? '🥢 stumpfer Winkel (zwischen 90° und 180°)' : d === 180 ? '➖ gestreckter Winkel (genau 180°)' : d < 360 ? '🌀 erhabener Winkel (zwischen 180° und 360°)' : '⭕ voller Winkel (360°)';
      $('[data-t]', el).innerHTML = t;
    });
  },
  triangle(el) {
    el.innerHTML = `<div class="widget-hint">👆 Verändere α und β – γ rechnet sich selbst aus:</div><div class="ctrl">${slider('a', 'α', 10, 150, 60, 5)}${slider('b', 'β', 10, 150, 70, 5)}</div><div data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ a, b }) => {
      if (a + b > 170) { b = 170 - a; $('[data-k=b]', el).value = b; $('[data-v=b]', el).textContent = b; }
      const g = 180 - a - b;
      $('[data-o]', el).innerHTML = svgTriangle(a, b, { labels: [a + '°', b + '°', g + '°'] });
      $('[data-t]', el).innerHTML = `${a}° + ${b}° + <span style="color:var(--teal)">${g}°</span> = 180° &nbsp; ${g === 90 || a === 90 || b === 90 ? '(rechtwinklig)' : g > 90 || a > 90 || b > 90 ? '(stumpfwinklig)' : '(spitzwinklig)'}`;
    });
  },
  parallelogram(el) {
    el.innerHTML = `<div class="widget-hint">👆 Schneide das Dreieck ab und schieb es rüber:</div><div class="ctrl">${slider('t', 'schieben', 0, 100, 0)}</div><div data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ t }) => {
      const s = t / 100, g = 200, o = 60, top = 20, bot = 140, x = 30;
      const tri = `${x + s * g},${bot} ${x + o + s * g},${top} ${x + o + s * g},${bot}`;
      $('[data-o]', el).innerHTML = `<svg width="330" height="170" viewBox="0 0 330 170">
        <polygon points="${x + o},${bot} ${x + g},${bot} ${x + g + o},${top} ${x + o},${top}" fill="#e0f7f3" stroke="#2b2340" stroke-width="2.5"/>
        <polygon points="${tri}" fill="#ffd6d0" stroke="#e5484d" stroke-width="2.5"/>
        <line x1="${x + o}" y1="${top}" x2="${x + o}" y2="${bot}" stroke="#e5484d" stroke-dasharray="5 4" stroke-width="2"/>
        <text x="${x + o + g / 2}" y="${bot + 22}" text-anchor="middle" font-weight="800">g</text><text x="${x + o - 18}" y="${(top + bot) / 2}" font-weight="800" fill="#e5484d">h</text></svg>`;
      $('[data-t]', el).innerHTML = t === 100 ? '🎉 Ein Rechteck! Fläche = g · h' : 'Parallelogramm';
    });
  },
  cuboid(el) {
    el.innerHTML = `<div class="widget-hint">👆 Baue einen Quader aus Würfeln (1 cm³):</div><div class="ctrl">${slider('l', 'Länge', 1, 6, 4)}${slider('w', 'Breite', 1, 4, 2)}${slider('h', 'Höhe', 1, 4, 3)}</div><div data-o></div><div class="out" data-t></div>`;
    bindSliders(el, ({ l, w, h }) => {
      $('[data-o]', el).innerHTML = svgCuboid(l, w, h, 'cm', true);
      $('[data-t]', el).innerHTML = `${l} · ${w} = ${l * w} Würfel pro Schicht · ${h} Schichten = <span style="color:var(--pri)">${l * w * h} cm³</span>`;
    });
  },
  mean(el) {
    const v = [3, 7, 4, 6]; let even = false;
    el.innerHTML = `<div data-o></div><div class="out" data-t></div><button class="btn primary" data-b>⚖️ Gleichmäßig verteilen</button>`;
    const draw = () => {
      const vals = even ? v.map(() => 5) : v;
      $('[data-o]', el).innerHTML = `<div class="row" style="justify-content:center;align-items:flex-end;gap:18px;min-height:200px">${vals.map((x, i) => `<div style="display:flex;flex-direction:column-reverse;gap:2px">${Array.from({ length: x }, () => `<div style="width:36px;height:22px;border-radius:5px;background:${COLS[i]}"></div>`).join('')}</div>`).join('')}</div>`;
      $('[data-t]', el).innerHTML = even ? 'Jeder Turm hat jetzt 5 → Mittelwert = 5' : `3 + 7 + 4 + 6 = 20 Steine, 4 Türme`;
      $('[data-b]', el).textContent = even ? '↺ Zurück' : '⚖️ Gleichmäßig verteilen';
    };
    $('[data-b]', el).onclick = () => { even = !even; draw(); }; draw();
  },
  units(el) {

/* Klick auf Koordinatensystem/Zahlenstrahl → Wert */
function svgPick(e, svg) {
  const r = svg.getBoundingClientRect(), d = svg.dataset;
  if (d.kind === 'coord') {
    const sc = +d.size / r.width, px = (e.clientX - r.left) * sc, py = (e.clientY - r.top) * sc, n = d.max - d.min, s = (d.size - 2 * d.pad) / n;
    const cl = v => Math.max(+d.min, Math.min(+d.max, v));
    return [cl(Math.round((px - d.pad) / s + +d.min)), cl(Math.round((d.size - d.pad - py) / s + +d.min))];
  }
  const sc = +d.w / r.width, px = (e.clientX - r.left) * sc, u = (d.w - 2 * d.pad) / (d.max - d.min);
  return Math.max(+d.min, Math.min(+d.max, Math.round(((px - d.pad) / u) * d.sub) / d.sub + +d.min));
}

  } },

upsert({ id: 'verbindung', icon: '🧩', title: 'Verbindung der vier Grundrechnungsarten', desc: 'Klammer, Punkt vor Strich – mit Brüchen',

let AC;

  } catch (e) { }
}
const sndOk = () => tone([[660, 0], [880, 0.1], [1320, 0.2, 0.2]]);

function confetti(n = 140) {
  const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;

/* ---------- Aufgaben-Komponente ---------- */
function answerHTML(t) {

  if (t.type === 'set') return `<span>${t.setPre}</span><input class="ans" data-s autocomplete="off" style="width:min(380px,62vw);text-align:left" aria-label="Zahlen mit Beistrich getrennt"><span>${t.setPost || '}'}</span>`;
  if (t.type === 'point') return `${t.pre ? `<span>${t.pre}</span>` : ''}<span>(</span><input class="ans" data-x inputmode="decimal" autocomplete="off" style="width:90px" aria-label="x-Koordinate"><span>|</span><input class="ans" data-y inputmode="decimal" autocomplete="off" style="width:90px" aria-label="y-Koordinate"><span>)</span>`;
  if (t.type === 'grid' || t.type === 'line') return `<div data-pick style="width:100%;text-align:center"></div><div class="small muted" style="width:100%;text-align:center">👆 Klicke auf die richtige Stelle</div>`;
  if (t.type === 'frac') return `<div class="frac-in"><input class="ans" data-n inputmode="numeric" autocomplete="off" aria-label="Zähler"><div class="line"></div><input class="ans" data-d inputmode="numeric" autocomplete="off" aria-label="Nenner"></div>`;

}
const fmtS = x => x < 0 ? '−' + fmt(-x) : fmt(x);
const answerText = t => t.type === 'frac' ? FA(t.answer) : t.type === 'num' ? `${t.pre ? t.pre + ' ' : ''}${fmtS(t.answer)} ${t.unit || ''}`
  : t.type === 'set' ? `{${t.answer.map(fmtS).join(', ')}${t.setPost ? ', …' : ''}}`
  : t.type === 'point' || t.type === 'grid' ? pt(...t.answer) : t.type === 'line' ? (t.answerHTML || fmtS(t.answer)) : esc(t.answer);
const SWAP = 'Vertauscht! Zuerst kommt x (nach rechts/links), dann y (nach oben/unten).';

function evaluate(t, box, picked) {
  if (t.type === 'choice') return { ok: picked === t.answer, trap: t.traps.find(x => x.v === picked) };
  if (t.type === 'set') {
    const raw = $('[data-s]', box).value.trim(); if (!raw) return { empty: true };
    const vals = raw.replace(/[{}]/g, '').split(/[;,\s]+/).filter(Boolean).map(parseNum);
    if (vals.some(v => v === null)) return { empty: true, msg: 'Bitte nur Zahlen eingeben, mit Beistrich getrennt – z. B. 1, 2, 3' };
    const g = [...new Set(vals)], miss = t.answer.filter(v => !g.includes(v)), extra = g.filter(v => !t.answer.includes(v));
    if (!miss.length && !extra.length) return { ok: true };
    let msg = '';
    if (t.firstMult && miss.includes(t.firstMult)) msg = `Achtung: Die Zahl selbst ist das erste Vielfache (1 · ${t.firstMult} = ${t.firstMult})!`;
    else if (t.edge) {
      const { a, b, lo, hi } = t.edge;
      if ((extra.includes(a) && lo === '<') || (extra.includes(b) && hi === '<')) msg = 'Bei „<“ gehört die Randzahl NICHT dazu!';
      else if ((miss.includes(a) && lo === '≤') || (miss.includes(b) && hi === '≤')) msg = 'Bei „≤“ gehört die Randzahl DAZU!';
    }
    if (!msg) msg = [miss.length ? `Es fehl${miss.length > 1 ? 'en' : 't'} noch ${miss.length} Zahl${miss.length > 1 ? 'en' : ''}.` : '', extra.length ? `${extra.map(fmtS).join(', ')} gehör${extra.length > 1 ? 'en' : 't'} nicht dazu.` : '', miss.length && /^T/.test(t.setPre) ? 'Tipp: Geh alle Teilerpaare der Reihe nach durch!' : ''].filter(Boolean).join(' ');

    if (!xy) return { empty: true, msg: 'Klicke zuerst auf eine Stelle 👆' };
    const [ax, ay] = t.answer, ok = xy[0] === ax && xy[1] === ay;
    const tr = t.traps.find(x => x.p && x.p[0] === xy[0] && x.p[1] === xy[1]);
    return { ok, trap: ok ? null : tr || (xy[0] === ay && xy[1] === ax ? { msg: SWAP } : null) };
  }
  if (t.type === 'line') {
    if (picked === null || picked === undefined) return { empty: true, msg: 'Klicke zuerst auf eine Stelle 👆' };

  }

}

function mountTask(box, t, { onResult, onNext, nextLabel = 'Weiter ➜', test = false }) {

  const fb = $('.fb', box), hb = $('.hint-box', box), hBtn = $('[data-hint]', box);
  const inputs = $$('input', box);

  if (pickBox) { drawPick(); pickBox.addEventListener('click', e => { if (done) return; const svg = $('svg', pickBox); if (!svg) return; sel = svgPick(e, svg); drawPick(); }); }
  box.__pick = v => { sel = v; drawPick(); };

  const showHint = () => { if (hints >= t.hints.length) return; hb.classList.remove('hidden'); hb.insertAdjacentHTML('beforeend', `<div>${t.hints[hints++]}</div>`); updHint(); };
  updHint();
  hBtn.onclick = showHint;
  $('[data-say]', box)?.addEventListener('click', () => say(t.q + (t.type === 'choice' ? '. Antworten: ' + t.choices.join(', ') : '')));
  const finish = ok => {
    done = true; const sec = Math.round((Date.now() - t0) / 1000);

    if (done) return;
    const r = evaluate(t, box, picked);
    if (r.empty) { $('.answer-area', box).classList.remove('shake'); void box.offsetWidth; $('.answer-area', box).classList.add('shake'); if (r.msg) toast(r.msg); else toast('Gib zuerst eine Antwort ein ✏️'); return; }
    if (r.partial) { fb.className = 'fb try'; fb.innerHTML = `<div class="head">${r.partial}</div>`; sndTry(); return; }
    if (r.ok) {
      if (t.type === 'choice') $(`.choice[data-c="${CSS.escape(picked)}"]`, box)?.classList.add('picked-ok');
      const xp = finish(true); sndOk(); if (tries === 0 && !hints) confetti(40);
      fb.className = 'fb ok'; fb.innerHTML = `<div class="head">${pick(PRAISE)} <span class="xp-pop">+${xp} XP</span></div>
        <details><summary class="small">So geht der Rechenweg</summary><ol class="steps">${t.steps.map(s => `<li>${s}</li>`).join('')}</ol></details>`;
      return;
    }
    tries++; sndTry();
    if (t.type === 'choice') { const b = $(`.choice[data-c="${CSS.escape(picked)}"]`, box); b?.classList.add('picked-bad'); if (b) b.disabled = true; }
    if (tries < maxTries) {
      fb.className = 'fb try'; fb.innerHTML = `<div class="head">${r.trap ? '🤔 ' + r.trap.msg : pick(TRY_AGAIN)}</div>`;
      if (hints === 0) showHint();
      const i = inputs[0]; if (i) { i.select(); i.focus(); }
      return;
    }
    finish(false);
    fb.className = 'fb bad'; fb.innerHTML = `<div class="head">${test ? 'Leider nicht richtig. So wäre es gegangen:' : 'Kein Problem – schauen wir es gemeinsam an! 🦉'}</div>
      ${r.trap ? `<p>🤔 ${r.trap.msg}</p>` : ''}<ol class="steps">${t.steps.map((s, i) => `<li style="animation-delay:${i * 0.35}s">${s}</li>`).join('')}</ol>
      <div>✅ Richtige Antwort: <b>${answerText(t)}</b></div><div class="small muted" style="margin-top:6px">Diese Aufgabe kommt in deine Fehler-Kiste – du bekommst bald eine Chance, sie zu knacken. 💪</div>`;
  };
  $('[data-check]', box)?.addEventListener('click', () => check(pickBox ? sel : undefined));
  $$('.choice', box).forEach(b => b.onclick = () => check(b.dataset.c));
  inputs.forEach((i, k) => i.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return; e.preventDefault();
    if ((t.type === 'frac' || t.type === 'point') && k === 0 && !inputs[1].value) return inputs[1].focus();
    check();
  }));
  setTimeout(() => inputs[0]?.focus(), 80);
}

function makeTask(topicId, level) { const t = TOPIC[topicId].gen(level); t.topic = topicId; t.level = level; return t; }

function record(t, r) {
  const s = tp(t.topic); s.seen++; if (r.ok) s.ok++; s.last = today();
  s.m = Math.max(0, Math.min(100, s.m + (r.ok ? (r.tries === 0 ? (r.hints ? 5 : 10) : 3) : -8)));
  const d = dayRec(); d.n++; if (r.ok) d.ok++; if (r.ok && r.tries === 0) d.ok1++; d.sec += Math.min(r.sec, 180);
  S.total++; S.xp += r.xp;
  if (!r.ok && !t.fromMistake) {
    const m = Object.assign({}, t, { mid: Date.now() + '' + rnd(0, 999), date: today(), fromMistake: true });
    S.mistakes.push(m); if (S.mistakes.length > 40) S.mistakes.shift();
  }
  if (r.ok && t.fromMistake) { S.mistakes = S.mistakes.filter(m => m.mid !== t.mid); S.fixed++; }
  if (!d.goal && d.n >= S.settings.goal) { d.goal = true; S.xp += 20; setTimeout(() => { toast('🎯 Tagesziel geschafft! <b>+20 XP</b>', 3500); confetti(); sndWin(); }, 400); }
  const before = lvl().l; save();
  if (lvl().l > before) setTimeout(() => { toast(`🎉 Level ${lvl().l}: <b>${lvl().title}</b>!`, 3500); confetti(200); sndWin(); }, 900);
  checkBadges(); header();
}

const WTAG = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
function examInfo() {
  const e = S.settings.exam; if (!e || !e.date) return null;
  const days = dayDiff(today(), e.date); if (days < 0) return null;
  const ids = e.topics.filter(id => TOPIC[id]), ready = ids.length ? Math.round(ids.reduce((a, id) => a + tp(id).m, 0) / ids.length) : 0;
  const d = new Date(e.date + 'T12:00:00');
  return Object.assign({}, e, { days, ids, ready, label: `${WTAG[d.getDay()]}, ${d.getDate()}.${d.getMonth() + 1}.` });
}
function examTopicToday() {
  const e = examInfo(); if (!e || !e.ids.length) return null;
  if (S.examDay && S.examDay.date === today() && e.ids.includes(S.examDay.topic)) return S.examDay;
  const y = new Date(); y.setDate(y.getDate() - 1); const yk = dkey(y);
  const score = id => tp(id).m - ((BOOK.boost || {})[id] || 1) * 8 + (tp(id).last === yk || tp(id).last === today() ? 25 : 0) + (tp(id).lesson ? 0 : -5);
  const id = [...e.ids].sort((a, b) => score(a) - score(b))[0];
  S.examDay = { date: today(), topic: id, done: false }; save();
  return S.examDay;
}
function examCard() {

function startExamTest() {

/* ---------- Trainings-Planer ---------- */
function candidateTopics() {
  const e = examInfo();
  if (e && e.days <= 21 && e.ids.length) return [...new Set([...e.ids, ...S.settings.focus.filter(id => TOPIC[id])])];
  const f = S.settings.focus.filter(id => TOPIC[id]);
  let c = TOPICS.filter(t => t.id !== 'kopf' && (f.includes(t.id) || tp(t.id).seen > 0 || tp(t.id).lesson || (BOOK.boost || {})[t.id])).map(t => t.id);
  if (!c.length) c = BOOK.defaultFocus;
  return c;
}
function weightedPick(ids, avoid) {
  const f = S.settings.focus, w = ids.map(id => {
    const s = tp(id), days = s.last ? Math.min(dayDiff(s.last, today()), 7) : 7;
    return (id === avoid && ids.length > 1 ? 0 : 1) * (f.includes(id) ? 3 : 1) * ((BOOK.boost || {})[id] || 1) * (1 + (100 - s.m) / 50) * (1 + days / 7);
  });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < ids.length; i++) { r -= w[i]; if (r <= 0) return ids[i]; }
  return ids[0];
}
function buildDaily() {
  const goal = S.settings.goal, list = [{ topic: 'kopf' }];
  if (goal >= 10) list.push({ topic: 'kopf' });
  shuffle(S.mistakes).slice(0, Math.min(3, Math.floor(goal / 4))).forEach(m => list.push({ topic: m.topic, task: m }));
  const pool = candidateTopics(); let last = null;
  while (list.length < goal) { const id = weightedPick(pool, last); list.push({ topic: id }); last = id; }
  const warm = list.filter(x => x.topic === 'kopf' && !x.task), rest = shuffle(list.filter(x => !(x.topic === 'kopf' && !x.task)));
  for (let i = 1; i < rest.length; i++) if (rest[i].topic === rest[i - 1].topic) { const j = rest.findIndex((x, k) => k > i && x.topic !== rest[i].topic && x.topic !== rest[i - 1].topic); if (j > 0) [rest[i], rest[j]] = [rest[j], rest[i]]; }
  return [...warm, ...rest];
}
